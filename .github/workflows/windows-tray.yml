name: Windows Tray

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Integrations/Windows/**"
      - ".github/workflows/windows-tray.yml"
  push:
    branches: [feat/windows]
    paths:
      - "Integrations/Windows/**"
      - ".github/workflows/windows-tray.yml"

permissions:
  contents: read

concurrency:
  group: windows-tray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Integrations/Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Integrations/Windows/src-tauri -> target
      - name: Install JS deps
        run: npm install --no-audit --no-fund
      - name: Build NSIS installer
        run: npx tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CodexBar-Windows-installer
          path: Integrations/Windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
